name: telemetry load
on:
  pull_request:
    paths:
      - scripts/load_check.py
      - scripts/run_stack_check.py
      - .github/workflows/load-check.yml

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/run_stack_check.py load_check
